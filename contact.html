---
layout: default
title: Contact
permalink: /contact/
---

<section class="contact-section">
    <div class="container">
        <h1 class="section-title">Get In Touch</h1>

        <div class="contact-form">
            <p style="text-align: center; margin-bottom: 2rem; color: var(--text-light);">
                Have a question or want to work together? I'd love to hear from you!
            </p>

            <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" name="subject" required>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" required></textarea>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    Send Message
                </button>
            </form>
        </div>

        <div class="contact-info">
            <h3>Other Ways to Connect</h3>
            <div class="contact-methods">
                <div class="contact-method">
                    <i class="fas fa-envelope"></i>
                    <a href="mailto:your.email@example.com">your.email@example.com</a>
                </div>
                <div class="contact-method">
                    <i class="fab fa-github"></i>
                    <a href="https://github.com/yourusername" target="_blank" rel="noopener noreferrer">GitHub</a>
                </div>
                <div class="contact-method">
                    <i class="fab fa-linkedin"></i>
                    <a href="https://linkedin.com/in/yourlinkedin" target="_blank" rel="noopener noreferrer">LinkedIn</a>
                </div>
                <div class="contact-method">
                    <i class="fab fa-twitter"></i>
                    <a href="https://twitter.com/yourtwitter" target="_blank" rel="noopener noreferrer">Twitter</a>
                </div>
            </div>
        </div>
    </div>
</section>
