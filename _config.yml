# Site settings
title: christaylor.codes
email: ctaylor@christaylor.codes
description: >-
  Personal website showcasing my work, projects, and professional experience.
  Welcome to my corner of the internet!
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://christaylor.codes" # the base hostname & protocol for your site
github_username: christaylorcodes
linkedin_username: christaylorcodes
#twitter_username: yourtwitter

# Social media defaults for Open Graph and Twitter Cards
# These settings work with jekyll-seo-tag plugin
social:
  name: Chris Taylor
  links:
    - https://github.com/christaylorcodes
    - https://www.linkedin.com/in/christaylorcodes
    - https://christaylor.codes

# Default social sharing image (used when page doesn't specify one)
# This appears when links are shared on social media
# TODO: Create a proper 1200x630px social card image for better sharing
logo: /assets/images/profile-photo.png

# Author defaults for blog posts
author:
  name: Chris Taylor
  email: ctaylor@christaylor.codes

# Twitter card settings
twitter:
  card: summary_large_image
  # username: christaylorcodes  # Uncomment and update when Twitter account is active

# Build settings
markdown: kramdown
highlighter: rouge

# Kramdown settings
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

# Pagination settings
paginate: 6  # Number of posts per page
paginate_path: "/blog/page:num/"

# Collections
collections:
  projects:
    output: false
    sort_by: order

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
  - CLAUDE.md
