<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1920" height="1080" fill="#1e1e1e"/>

  <!-- Title Section -->
  <rect x="60" y="60" width="1800" height="100" rx="8" fill="#252526" stroke="#f59e0b" stroke-width="3"/>
  <text x="960" y="125" font-family="Arial, sans-serif" font-size="42" fill="#f59e0b" text-anchor="middle" font-weight="bold">
    Mass Agent Deployment Workflow
  </text>

  <!-- Flow Diagram -->
  <!-- Step 1 -->
  <rect x="120" y="240" width="300" height="180" rx="10" fill="#1e293b" stroke="#06b6d4" stroke-width="3"/>
  <circle cx="270" cy="280" r="25" fill="#06b6d4"/>
  <text x="270" y="290" font-family="Arial, sans-serif" font-size="24" fill="#1e1e1e" text-anchor="middle" font-weight="bold">1</text>
  <text x="270" y="345" font-family="Arial, sans-serif" font-size="22" fill="#f1f5f9" text-anchor="middle" font-weight="bold">
    Prepare Configuration
  </text>
  <text x="270" y="375" font-family="Arial, sans-serif" font-size="16" fill="#cbd5e1" text-anchor="middle">
    Server URL
  </text>
  <text x="270" y="400" font-family="Arial, sans-serif" font-size="16" fill="#cbd5e1" text-anchor="middle">
    Location ID
  </text>

  <!-- Arrow 1 -->
  <polygon points="440,330 520,330 520,315 560,345 520,375 520,360 440,360" fill="#475569"/>

  <!-- Step 2 -->
  <rect x="580" y="240" width="300" height="180" rx="10" fill="#1e293b" stroke="#06b6d4" stroke-width="3"/>
  <circle cx="730" cy="280" r="25" fill="#06b6d4"/>
  <text x="730" y="290" font-family="Arial, sans-serif" font-size="24" fill="#1e1e1e" text-anchor="middle" font-weight="bold">2</text>
  <text x="730" y="345" font-family="Arial, sans-serif" font-size="22" fill="#f1f5f9" text-anchor="middle" font-weight="bold">
    Deploy to Endpoints
  </text>
  <text x="730" y="375" font-family="Arial, sans-serif" font-size="16" fill="#cbd5e1" text-anchor="middle">
    Parallel Execution
  </text>
  <text x="730" y="400" font-family="Arial, sans-serif" font-size="16" fill="#cbd5e1" text-anchor="middle">
    1000+ devices
  </text>

  <!-- Arrow 2 -->
  <polygon points="900,330 980,330 980,315 1020,345 980,375 980,360 900,360" fill="#475569"/>

  <!-- Step 3 -->
  <rect x="1040" y="240" width="300" height="180" rx="10" fill="#1e293b" stroke="#06b6d4" stroke-width="3"/>
  <circle cx="1190" cy="280" r="25" fill="#06b6d4"/>
  <text x="1190" y="290" font-family="Arial, sans-serif" font-size="24" fill="#1e1e1e" text-anchor="middle" font-weight="bold">3</text>
  <text x="1190" y="345" font-family="Arial, sans-serif" font-size="22" fill="#f1f5f9" text-anchor="middle" font-weight="bold">
    Verify & Report
  </text>
  <text x="1190" y="375" font-family="Arial, sans-serif" font-size="16" fill="#cbd5e1" text-anchor="middle">
    Health Check
  </text>
  <text x="1190" y="400" font-family="Arial, sans-serif" font-size="16" fill="#cbd5e1" text-anchor="middle">
    Success Rate
  </text>

  <!-- Bottom Arrow 3 -->
  <polygon points="1190,440 1205,440 1205,500 1220,500 1190,540 1160,500 1175,500 1175,440" fill="#475569"/>

  <!-- Step 4 -->
  <rect x="1040" y="560" width="300" height="180" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="3"/>
  <circle cx="1190" cy="600" r="25" fill="#10b981"/>
  <text x="1190" y="610" font-family="Arial, sans-serif" font-size="24" fill="#1e1e1e" text-anchor="middle" font-weight="bold">✓</text>
  <text x="1190" y="665" font-family="Arial, sans-serif" font-size="22" fill="#f1f5f9" text-anchor="middle" font-weight="bold">
    Complete
  </text>
  <text x="1190" y="695" font-family="Arial, sans-serif" font-size="16" fill="#cbd5e1" text-anchor="middle">
    Agents Online
  </text>
  <text x="1190" y="720" font-family="Arial, sans-serif" font-size="16" fill="#cbd5e1" text-anchor="middle">
    Reporting Data
  </text>

  <!-- Code Example Section -->
  <rect x="120" y="480" width="760" height="440" rx="10" fill="#252526" stroke="#3c3c3c" stroke-width="2"/>
  <rect x="120" y="480" width="760" height="40" fill="#2d2d30"/>
  <text x="500" y="506" font-family="'Courier New', monospace" font-size="14" fill="#cccccc" text-anchor="middle">
    PowerShell - Mass Deployment Example
  </text>

  <!-- Code -->
  <text x="150" y="560" font-family="'Courier New', monospace" font-size="16" fill="#6a9955"># Deploy to 1000 endpoints in 2 minutes</text>
  <text x="150" y="600" font-family="'Courier New', monospace" font-size="16" fill="#9cdcfe">$endpoints</text>
  <text x="280" y="600" font-family="'Courier New', monospace" font-size="16" fill="#d4d4d4"> =</text>
  <text x="320" y="600" font-family="'Courier New', monospace" font-size="16" fill="#dcdcaa"> Get-ADComputer</text>
  <text x="520" y="600" font-family="'Courier New', monospace" font-size="16" fill="#9cdcfe"> -Filter</text>
  <text x="650" y="600" font-family="'Courier New', monospace" font-size="16" fill="#ce9178"> "*"</text>

  <text x="150" y="640" font-family="'Courier New', monospace" font-size="16" fill="#9cdcfe">$params</text>
  <text x="260" y="640" font-family="'Courier New', monospace" font-size="16" fill="#d4d4d4"> = @{</text>
  <text x="200" y="670" font-family="'Courier New', monospace" font-size="16" fill="#9cdcfe">Server</text>
  <text x="310" y="670" font-family="'Courier New', monospace" font-size="16" fill="#d4d4d4"> =</text>
  <text x="350" y="670" font-family="'Courier New', monospace" font-size="16" fill="#ce9178"> "automate.company.com"</text>
  <text x="200" y="700" font-family="'Courier New', monospace" font-size="16" fill="#9cdcfe">LocationID</text>
  <text x="360" y="700" font-family="'Courier New', monospace" font-size="16" fill="#d4d4d4"> =</text>
  <text x="400" y="700" font-family="'Courier New', monospace" font-size="16" fill="#b5cea8"> 42</text>
  <text x="200" y="730" font-family="'Courier New', monospace" font-size="16" fill="#9cdcfe">Silent</text>
  <text x="310" y="730" font-family="'Courier New', monospace" font-size="16" fill="#d4d4d4"> =</text>
  <text x="350" y="730" font-family="'Courier New', monospace" font-size="16" fill="#569cd6"> $true</text>
  <text x="150" y="760" font-family="'Courier New', monospace" font-size="16" fill="#d4d4d4">}</text>

  <text x="150" y="800" font-family="'Courier New', monospace" font-size="16" fill="#9cdcfe">$endpoints</text>
  <text x="280" y="800" font-family="'Courier New', monospace" font-size="16" fill="#d4d4d4"> |</text>
  <text x="310" y="800" font-family="'Courier New', monospace" font-size="16" fill="#dcdcaa"> Install-CWAAgent</text>
  <text x="550" y="800" font-family="'Courier New', monospace" font-size="16" fill="#9cdcfe"> @params</text>
  <text x="680" y="800" font-family="'Courier New', monospace" font-size="16" fill="#9cdcfe"> -Parallel</text>

  <text x="150" y="860" font-family="'Courier New', monospace" font-size="14" fill="#10b981">✓ 987 agents deployed successfully</text>
  <text x="150" y="890" font-family="'Courier New', monospace" font-size="14" fill="#f59e0b">⚠ 13 agents require retry (dependencies missing)</text>

  <!-- Performance Metrics -->
  <rect x="1440" y="40" width="400" height="260" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="1640" y="85" font-family="Arial, sans-serif" font-size="22" fill="#f59e0b" text-anchor="middle" font-weight="bold">
    Performance Metrics
  </text>
  <text x="1640" y="135" font-family="Arial, sans-serif" font-size="48" fill="#10b981" text-anchor="middle" font-weight="bold">
    2:14
  </text>
  <text x="1640" y="165" font-family="Arial, sans-serif" font-size="16" fill="#cbd5e1" text-anchor="middle">
    Average deployment time
  </text>
  <text x="1640" y="210" font-family="Arial, sans-serif" font-size="36" fill="#06b6d4" text-anchor="middle" font-weight="bold">
    98.7%
  </text>
  <text x="1640" y="240" font-family="Arial, sans-serif" font-size="16" fill="#cbd5e1" text-anchor="middle">
    Success rate
  </text>
  <text x="1640" y="280" font-family="Arial, sans-serif" font-size="14" fill="#6a9955" text-anchor="middle">
    vs 20+ min manual deployment
  </text>

  <!-- Bottom -->
  <text x="120" y="1000" font-family="'Courier New', monospace" font-size="14" fill="#6a9955">
    # ConnectWiseAutomateAgent - Enterprise Scale Deployment
  </text>
</svg>