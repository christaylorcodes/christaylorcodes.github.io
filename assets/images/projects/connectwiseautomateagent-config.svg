<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
  <rect width="1920" height="1080" fill="#1e1e1e"/>
  <text x="960" y="100" font-family="Arial" font-size="48" fill="#f59e0b" text-anchor="middle" font-weight="bold">Configuration Management</text>

  <!-- Before/After Comparison -->
  <rect x="100" y="180" width="800" height="800" rx="12" fill="#1e293b" stroke="#dc2626" stroke-width="3"/>
  <text x="500" y="240" font-family="Arial" font-size="32" fill="#dc2626" text-anchor="middle" font-weight="bold">❌ Manual Process</text>

  <text x="140" y="310" font-family="Arial" font-size="20" fill="#f1f5f9" font-weight="bold">1. Remote Desktop to each endpoint</text>
  <text x="170" y="345" font-family="Arial" font-size="16" fill="#cbd5e1">Time: 3-5 minutes per device</text>

  <text x="140" y="410" font-family="Arial" font-size="20" fill="#f1f5f9" font-weight="bold">2. Locate Automate agent service</text>
  <text x="170" y="445" font-family="Arial" font-size="16" fill="#cbd5e1">Navigate services.msc</text>

  <text x="140" y="510" font-family="Arial" font-size="20" fill="#f1f5f9" font-weight="bold">3. Edit configuration file manually</text>
  <text x="170" y="545" font-family="Arial" font-size="16" fill="#cbd5e1">Find .ini file, update server URL</text>

  <text x="140" y="610" font-family="Arial" font-size="20" fill="#f1f5f9" font-weight="bold">4. Restart service</text>
  <text x="170" y="645" font-family="Arial" font-size="16" fill="#cbd5e1">Hope nothing breaks</text>

  <text x="140" y="710" font-family="Arial" font-size="20" fill="#f1f5f9" font-weight="bold">5. Verify connection</text>
  <text x="170" y="745" font-family="Arial" font-size="16" fill="#cbd5e1">Check logs, test connectivity</text>

  <rect x="140" y="810" width="720" height="120" rx="8" fill="#991b1b"/>
  <text x="500" y="860" font-family="Arial" font-size="28" fill="#ffffff" text-anchor="middle" font-weight="bold">20+ minutes per endpoint</text>
  <text x="500" y="900" font-family="Arial" font-size="18" fill="#fca5a5" text-anchor="middle">Error-prone, time-consuming, not scalable</text>

  <!-- Automated Process -->
  <rect x="1020" y="180" width="800" height="800" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="3"/>
  <text x="1420" y="240" font-family="Arial" font-size="32" fill="#10b981" text-anchor="middle" font-weight="bold">✓ Automated Process</text>

  <rect x="1060" y="290" width="720" height="380" rx="8" fill="#252526"/>
  <rect x="1060" y="290" width="720" height="40" fill="#2d2d30"/>
  <text x="1420" y="316" font-family="'Courier New', monospace" font-size="14" fill="#cccccc" text-anchor="middle">PowerShell - One Command</text>

  <text x="1100" y="370" font-family="'Courier New', monospace" font-size="18" fill="#6a9955"># Update 1000 agents to new server</text>
  <text x="1100" y="410" font-family="'Courier New', monospace" font-size="18" fill="#dcdcaa">Set-CWAServer</text>
  <text x="1320" y="410" font-family="'Courier New', monospace" font-size="18" fill="#9cdcfe"> -Server</text>
  <text x="1460" y="410" font-family="'Courier New', monospace" font-size="18" fill="#ce9178"> `</text>
  <text x="1140" y="450" font-family="'Courier New', monospace" font-size="18" fill="#ce9178">"new-automate.company.com"</text>
  <text x="1540" y="450" font-family="'Courier New', monospace" font-size="18" fill="#9cdcfe"> `</text>
  <text x="1140" y="490" font-family="'Courier New', monospace" font-size="18" fill="#9cdcfe">-ComputerName</text>
  <text x="1380" y="490" font-family="'Courier New', monospace" font-size="18" fill="#9cdcfe"> $allComputers</text>
  <text x="1620" y="490" font-family="'Courier New', monospace" font-size="18" fill="#9cdcfe"> `</text>
  <text x="1140" y="530" font-family="'Courier New', monospace" font-size="18" fill="#9cdcfe">-Parallel</text>
  <text x="1320" y="530" font-family="'Courier New', monospace" font-size="18" fill="#9cdcfe"> -Restart</text>

  <text x="1100" y="600" font-family="'Courier New', monospace" font-size="16" fill="#10b981">✓ 987 agents updated successfully</text>
  <text x="1100" y="630" font-family="'Courier New', monospace" font-size="16" fill="#10b981">✓ All online and reporting</text>
  <text x="1100" y="660" font-family="'Courier New', monospace" font-size="16" fill="#6a9955"># Completed in 2:14 (vs 333+ hours manual)</text>

  <rect x="1060" y="720" width="720" height="120" rx="8" fill="#065f46"/>
  <text x="1420" y="770" font-family="Arial" font-size="28" fill="#ffffff" text-anchor="middle" font-weight="bold">2 minutes for 1000 endpoints</text>
  <text x="1420" y="810" font-family="Arial" font-size="18" fill="#6ee7b7" text-anchor="middle">Automated, reliable, scalable</text>

  <rect x="1060" y="870" width="720" height="80" rx="8" fill="#f59e0b"/>
  <text x="1420" y="920" font-family="Arial" font-size="26" fill="#1e1e1e" text-anchor="middle" font-weight="bold">⚡ 10,000x faster</text>
</svg>