<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0284c7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38bdf8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Decorative accent bar -->
  <rect x="0" y="0" width="1200" height="8" fill="url(#accentGradient)"/>
  <rect x="0" y="622" width="1200" height="8" fill="url(#accentGradient)"/>

  <!-- Large decorative icon -->
  <circle cx="200" cy="315" r="80" fill="#06b6d4" opacity="0.15"/>
  <text x="200" y="350" font-family="Arial, sans-serif" font-size="80" fill="#06b6d4" text-anchor="middle" opacity="0.8">⚡</text>

  <!-- Main content -->
  <text x="350" y="220" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="#f1f5f9">
    ConnectWise Manage API
  </text>

  <text x="350" y="280" font-family="Arial, sans-serif" font-size="28" fill="#cbd5e1">
    PowerShell Module for MSP Automation
  </text>

  <!-- Feature highlights -->
  <text x="350" y="360" font-family="Arial, sans-serif" font-size="22" fill="#06b6d4">
    ✓ Dynamic Parameter Validation
  </text>
  <text x="350" y="400" font-family="Arial, sans-serif" font-size="22" fill="#06b6d4">
    ✓ Automatic Pagination
  </text>
  <text x="350" y="440" font-family="Arial, sans-serif" font-size="22" fill="#06b6d4">
    ✓ Intelligent Error Handling
  </text>
  <text x="350" y="480" font-family="Arial, sans-serif" font-size="22" fill="#06b6d4">
    ✓ Type-Safe PowerShell Objects
  </text>

  <!-- Bottom branding -->
  <text x="600" y="580" font-family="Arial, sans-serif" font-size="18" fill="#64748b" text-anchor="middle">
    Chris Taylor • christaylor.codes
  </text>
</svg>