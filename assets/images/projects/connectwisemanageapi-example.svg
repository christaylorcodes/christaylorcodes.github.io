  <text x="85" y="600" font-family="'Courier New', monospace" font-size="14" fill="#858585" text-anchor="middle">12</text>
  <text x="85" y="640" font-family="'Courier New', monospace" font-size="14" fill="#858585" text-anchor="middle">13</text>
  <text x="85" y="680" font-family="'Courier New', monospace" font-size="14" fill="#858585" text-anchor="middle">14</text>
  <text x="85" y="720" font-family="'Courier New', monospace" font-size="14" fill="#858585" text-anchor="middle">15</text>
  <text x="85" y="760" font-family="'Courier New', monospace" font-size="14" fill="#858585" text-anchor="middle">16</text>
  <text x="85" y="800" font-family="'Courier New', monospace" font-size="14" fill="#858585" text-anchor="middle">17</text>
  <text x="85" y="840" font-family="'Courier New', monospace" font-size="14" fill="#858585" text-anchor="middle">18</text>

  <!-- Code content -->
  <text x="140" y="160" font-family="'Courier New', monospace" font-size="16" fill="#6a9955"># Real-World MSP Automation Example</text>
  <text x="140" y="200" font-family="'Courier New', monospace" font-size="16" fill="#6a9955"># Auto-escalate aging critical tickets</text>

  <text x="140" y="280" font-family="'Courier New', monospace" font-size="16" fill="#c586c0">$</text>
  <text x="155" y="280" font-family="'Courier New', monospace" font-size="16" fill="#9cdcfe">staleTickets</text>
  <text x="295" y="280" font-family="'Courier New', monospace" font-size="16" fill="#d4d4d4"> =</text>
  <text x="330" y="280" font-family="'Courier New', monospace" font-size="16" fill="#dcdcaa"> Get-CWMTicket</text>
  <text x="520" y="280" font-family="'Courier New', monospace" font-size="16" fill="#9cdcfe"> -Priority</text>
  <text x="670" y="280" font-family="'Courier New', monospace" font-size="16" fill="#ce9178"> "Critical"</text>
  <text x="830" y="280" font-family="'Courier New', monospace" font-size="16" fill="#9cdcfe"> -Status</text>
  <text x="960" y="280" font-family="'Courier New', monospace" font-size="16" fill="#ce9178"> "Open"</text>
  <text x="1080" y="280" font-family="'Courier New', monospace" font-size="16" fill="#d4d4d4"> |</text>

  <text x="190" y="320" font-family="'Courier New', monospace" font-size="16" fill="#dcdcaa">Where-Object</text>
  <text x="360" y="320" font-family="'Courier New', monospace" font-size="16" fill="#d4d4d4"> {</text>
  <text x="390" y="320" font-family="'Courier New', monospace" font-size="16" fill="#9cdcfe">$_</text>
  <text x="420" y="320" font-family="'Courier New', monospace" font-size="16" fill="#d4d4d4">.DateEntered</text>
  <text x="590" y="320" font-family="'Courier New', monospace" font-size="16" fill="#d4d4d4"> -lt (</text>
  <text x="670" y="320" font-family="'Courier New', monospace" font-size="16" fill="#dcdcaa">Get-Date</text>
  <text x="790" y="320" font-family="'Courier New', monospace" font-size="16" fill="#d4d4d4">).</text>
  <text x="830" y="320" font-family="'Courier New', monospace" font-size="16" fill="#dcdcaa">AddHours</text>
  <text x="970" y="320" font-family="'Courier New', monospace" font-size="16" fill="#d4d4d4">(-</text>
  <text x="1005" y="320" font-family="'Courier New', monospace" font-size="16" fill="#b5cea8">24</text>
  <text x="1040" y="320" font-family="'Courier New', monospace" font-size="16" fill="#d4d4d4">) }</text>

  <text x="140" y="400" font-family="'Courier New', monospace" font-size="16" fill="#c586c0">foreach</text>
  <text x="250" y="400" font-family="'Courier New', monospace" font-size="16" fill="#d4d4d4"> (</text>
  <text x="270" y="400" font-family="'Courier New', monospace" font-size="16" fill="#9cdcfe">$ticket</text>
  <text x="380" y="400" font-family="'Courier New', monospace" font-size="16" fill="#c586c0"> in</text>
  <text x="430" y="400" font-family="'Courier New', monospace" font-size="16" fill="#9cdcfe"> $staleTickets</text>
  <text x="590" y="400" font-family="'Courier New', monospace" font-size="16" fill="#d4d4d4">) {</text>

  <text x="190" y="440" font-family="'Courier New', monospace" font-size="16" fill="#6a9955"># Add internal note</text>
  <text x="190" y="480" font-family="'Courier New', monospace" font-size="16" fill="#dcdcaa">New-CWMTicketNote</text>
  <text x="410" y="480" font-family="'Courier New', monospace" font-size="16" fill="#9cdcfe"> -TicketId</text>
  <text x="550" y="480" font-family="'Courier New', monospace" font-size="16" fill="#9cdcfe"> $ticket</text>
  <text x="660" y="480" font-family="'Courier New', monospace" font-size="16" fill="#d4d4d4">.Id</text>
  <text x="725" y="480" font-family="'Courier New', monospace" font-size="16" fill="#9cdcfe"> -Text</text>
  <text x="820" y="480" font-family="'Courier New', monospace" font-size="16" fill="#ce9178"> "Auto-escalated: 24+ hours"</text>
  <text x="1280" y="480" font-family="'Courier New', monospace" font-size="16" fill="#9cdcfe"> `</text>

  <text x="240" y="520" font-family="'Courier New', monospace" font-size="16" fill="#9cdcfe">-InternalFlag</text>
  <text x="420" y="520" font-family="'Courier New', monospace" font-size="16" fill="#569cd6"> $true</text>

  <text x="190" y="600" font-family="'Courier New', monospace" font-size="16" fill="#6a9955"># Update priority to escalated</text>
  <text x="190" y="640" font-family="'Courier New', monospace" font-size="16" fill="#dcdcaa">Update-CWMTicket</text>
  <text x="410" y="640" font-family="'Courier New', monospace" font-size="16" fill="#9cdcfe"> -TicketId</text>
  <text x="550" y="640" font-family="'Courier New', monospace" font-size="16" fill="#9cdcfe"> $ticket</text>
  <text x="660" y="640" font-family="'Courier New', monospace" font-size="16" fill="#d4d4d4">.Id</text>
  <text x="725" y="640" font-family="'Courier New', monospace" font-size="16" fill="#9cdcfe"> -Priority</text>
  <text x="880" y="640" font-family="'Courier New', monospace" font-size="16" fill="#ce9178"> "Escalated"</text>

  <text x="190" y="720" font-family="'Courier New', monospace" font-size="16" fill="#dcdcaa">Write-Host</text>
  <text x="320" y="720" font-family="'Courier New', monospace" font-size="16" fill="#ce9178"> "Escalated ticket $($ticket.Id): $($ticket.Summary)"</text>
  <text x="1220" y="720" font-family="'Courier New', monospace" font-size="16" fill="#9cdcfe"> -ForegroundColor</text>
  <text x="1520" y="720" font-family="'Courier New', monospace" font-size="16" fill="#ce9178"> Yellow</text>

  <text x="140" y="760" font-family="'Courier New', monospace" font-size="16" fill="#d4d4d4">}</text>

  <text x="140" y="840" font-family="'Courier New', monospace" font-size="16" fill="#dcdcaa">Write-Host</text>
  <text x="270" y="840" font-family="'Courier New', monospace" font-size="16" fill="#ce9178"> "Processed $($staleTickets.Count) tickets"</text>
  <text x="780" y="840" font-family="'Courier New', monospace" font-size="16" fill="#9cdcfe"> -ForegroundColor</text>
  <text x="1080" y="840" font-family="'Courier New', monospace" font-size="16" fill="#ce9178"> Green</text>

  <!-- Feature callout box -->
  <rect x="1100" y="140" width="680" height="620" rx="8" fill="#1a1a1a" stroke="#06b6d4" stroke-width="3"/>

