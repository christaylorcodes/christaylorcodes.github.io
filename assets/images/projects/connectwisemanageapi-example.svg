  <text x="1130" y="270" font-family="'Segoe UI', Arial, sans-serif" font-size="20" fill="#f59e0b" font-weight="bold">Problem Solved:</text>
  <text x="1130" y="305" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#d4d4d4">Manual ticket escalation is time-consuming</text>
  <text x="1130" y="330" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#d4d4d4">and SLAs get missed during off-hours.</text>

  <text x="1130" y="390" font-family="'Segoe UI', Arial, sans-serif" font-size="20" fill="#4ec9b0" font-weight="bold">Benefits:</text>

  <text x="1130" y="435" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#4ec9b0">✓</text>
  <text x="1160" y="435" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#dcdcaa" font-weight="bold">Automatic SLA Management</text>
  <text x="1170" y="460" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#d4d4d4">No critical tickets fall through cracks</text>

  <text x="1130" y="505" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#4ec9b0">✓</text>
  <text x="1160" y="505" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#dcdcaa" font-weight="bold">24/7 Monitoring</text>
  <text x="1170" y="530" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#d4d4d4">Runs as scheduled task or Azure Function</text>

  <text x="1130" y="575" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#4ec9b0">✓</text>
  <text x="1160" y="575" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#dcdcaa" font-weight="bold">Audit Trail</text>
  <text x="1170" y="600" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#d4d4d4">Internal notes document automation actions</text>

  <text x="1130" y="645" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#4ec9b0">✓</text>
  <text x="1160" y="645" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#dcdcaa" font-weight="bold">Error Handling</text>
  <text x="1170" y="670" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#d4d4d4">Intelligent retry and validation built-in</text>

