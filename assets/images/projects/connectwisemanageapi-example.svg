  <text x="1440" y="726" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="bold">⚡ Saves 2-3 hours per day for MSP operations teams</text>

  <!-- Bottom watermark -->
  <text x="140" y="990" font-family="'Courier New', monospace" font-size="14" fill="#6a9955"># ConnectWiseManageAPI - Automate Your MSP Workflows • christaylor.codes</text>
