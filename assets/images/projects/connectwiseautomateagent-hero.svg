<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Top accent -->
  <rect x="0" y="0" width="1200" height="6" fill="#f59e0b"/>

  <!-- Title -->
  <text x="600" y="80" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="#f1f5f9" text-anchor="middle">
    ConnectWiseAutomateAgent
  </text>
  <text x="600" y="120" font-family="Arial, sans-serif" font-size="24" fill="#cbd5e1" text-anchor="middle">
    Enterprise RMM Agent Deployment & Management
  </text>

  <!-- Architecture Diagram -->
  <!-- Central Hub -->
  <circle cx="600" cy="350" r="70" fill="#334155" stroke="#f59e0b" stroke-width="3"/>
  <text x="600" y="340" font-family="Arial, sans-serif" font-size="16" fill="#f59e0b" text-anchor="middle" font-weight="bold">PowerShell</text>
  <text x="600" y="365" font-family="Arial, sans-serif" font-size="14" fill="#f1f5f9" text-anchor="middle">Module</text>

  <!-- Top Nodes - Deployment -->
  <rect x="200" y="200" width="140" height="70" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
  <text x="270" y="225" font-family="Arial, sans-serif" font-size="14" fill="#06b6d4" text-anchor="middle" font-weight="bold">Install</text>
  <text x="270" y="245" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Silent Deploy</text>
  <text x="270" y="260" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Pre-config</text>

  <rect x="860" y="200" width="140" height="70" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
  <text x="930" y="225" font-family="Arial, sans-serif" font-size="14" fill="#06b6d4" text-anchor="middle" font-weight="bold">Configure</text>
  <text x="930" y="245" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Server URL</text>
  <text x="930" y="260" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Locations</text>

  <!-- Bottom Nodes - Management -->
  <rect x="200" y="450" width="140" height="70" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="270" y="475" font-family="Arial, sans-serif" font-size="14" fill="#10b981" text-anchor="middle" font-weight="bold">Monitor</text>
  <text x="270" y="495" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Health Check</text>
  <text x="270" y="510" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Status</text>

  <rect x="860" y="450" width="140" height="70" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="930" y="475" font-family="Arial, sans-serif" font-size="14" fill="#10b981" text-anchor="middle" font-weight="bold">Repair</text>
  <text x="930" y="495" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Auto-fix</text>
  <text x="930" y="510" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Recovery</text>

  <!-- Connection Lines -->
  <line x1="340" y1="235" x2="540" y2="320" stroke="#475569" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="860" y1="235" x2="660" y2="320" stroke="#475569" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="340" y1="485" x2="540" y2="380" stroke="#475569" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="860" y1="485" x2="660" y2="380" stroke="#475569" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- Bottom Stats -->
  <rect x="100" y="560" width="1000" height="50" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <text x="600" y="592" font-family="Arial, sans-serif" font-size="18" fill="#f1f5f9" text-anchor="middle" font-weight="bold">
    20+ min → 2 min deployment  |  1000+ endpoints managed  |  Zero-touch automation
  </text>
</svg>