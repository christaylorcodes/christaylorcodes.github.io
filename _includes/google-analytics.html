     GA4 is loaded via cookie-consent.html with user consent gating.
     Kept for reference only. -->
<!-- Google Analytics 4 -->
<!-- Only load in production (not localhost) -->
{% if site.google_analytics and jekyll.environment == 'production' %}
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', '{{ site.google_analytics }}', {
    'anonymize_ip': true,
    'cookie_flags': 'SameSite=None;Secure'
  });

  // Custom event tracking for outbound links
  document.addEventListener('click', function(event) {
    if (event.target.tagName === 'A') {
      const href = event.target.getAttribute('href');

      // Track GitHub links
      if (href && href.includes('github.com')) {
        gtag('event', 'click', {
          'event_category': 'outbound',
          'event_label': 'GitHub Link',
          'value': href
        });
      }

      // Track PowerShell Gallery links
      if (href && href.includes('powershellgallery.com')) {
        gtag('event', 'click', {
          'event_category': 'outbound',
          'event_label': 'PowerShell Gallery Link',
          'value': href
        });
      }

      // Track social media links
      if (href && (href.includes('linkedin.com') || href.includes('twitter.com') || href.includes('x.com'))) {
        gtag('event', 'click', {
          'event_category': 'social',
          'event_label': 'Social Media Link',
          'value': href
        });
      }
    }
  });

  // Track contact form submissions
  const contactForm = document.querySelector('form[action*="formspree"]');
  if (contactForm) {
    contactForm.addEventListener('submit', function() {
      gtag('event', 'submit', {
        'event_category': 'contact',
        'event_label': 'Contact Form Submission'
      });
    });
  }
</script>
{% endif %}
