<!-- Enhanced Person Schema (JSON-LD) for About Page -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "{{ site.data.author.name }}",
  "url": "{{ site.url }}",
  "email": "{{ site.data.contact.email }}",
  "image": "{{ site.logo | absolute_url }}",
  "jobTitle": "{{ site.data.author.structured_data.job_title }}",
  "description": "{{ site.data.author.structured_data.description }}",
  "worksFor": {
    "@type": "Organization",
    "name": "{{ site.data.author.company }}",
    "description": "{{ site.data.author.company_description }}"
  },
  "knowsAbout": {{ site.data.author.expertise.knows_about | jsonify }},
  "sameAs": {{ site.data.contact.social_profiles | jsonify }},
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "{{ site.url }}{{ '/about' | relative_url }}"
  },
  "alumniOf": {
    "@type": "Organization",
    "name": "{{ site.data.author.alumni_of }}"
  },
  "hasOccupation": {
    "@type": "Occupation",
    "name": "{{ site.data.author.structured_data.job_title }}",
    "occupationLocation": {
      "@type": "Country",
      "name": "{{ site.data.author.location }}"
    },
    "skills": "{{ site.data.author.structured_data.occupation_skills }}"
  },
  "seeks": {
    "@type": "JobPosting",
    "description": "{{ site.data.author.structured_data.seeking }}"
  }
}
</script>
