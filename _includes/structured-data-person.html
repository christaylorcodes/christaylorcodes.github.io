<!-- Enhanced Person Schema (JSON-LD) for About Page - Optimized for Recruiter Discovery -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "{{ site.data.author.name }}",
  "givenName": "{{ site.data.author.first_name }}",
  "familyName": "{{ site.data.author.last_name }}",
  "url": "{{ site.url }}",
  "email": "{{ site.data.contact.email }}",
  "image": "{{ site.logo | absolute_url }}",
  "jobTitle": "{{ site.data.author.structured_data.job_title }}",
  "description": "{{ site.data.author.structured_data.description }}",
  "worksFor": {
    "@type": "Organization",
    "name": "{{ site.data.author.company }}",
    "description": "{{ site.data.author.company_description }}"
  },
  "knowsAbout": {{ site.data.author.expertise.knows_about | jsonify }},
  "knowsLanguage": {
    "@type": "Language",
    "name": "English"
  },
  "sameAs": {{ site.data.contact.social_profiles | jsonify }},
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "{{ site.url }}{{ '/about' | relative_url }}"
  },
  "alumniOf": {
    "@type": "Organization",
    "name": "{{ site.data.author.alumni_of }}"
  },
  "hasOccupation": {
    "@type": "Occupation",
    "name": "{{ site.data.author.structured_data.job_title }}",
    "occupationLocation": {
      "@type": "Country",
      "name": "{{ site.data.author.location }}"
    },
    "skills": "{{ site.data.author.structured_data.occupation_skills }}",
    "experienceRequirements": "{{ site.data.author.experience_years }} years of professional experience"
  },
  {% if site.data.author.structured_data.credentials %}
  "hasCredential": [
    {% for credential in site.data.author.structured_data.credentials %}
    {
      "@type": "EducationalOccupationalCredential",
      "name": "{{ credential.name }}",
      "credentialCategory": "{{ credential.category }}"
    }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ],
  {% endif %}
  "seeks": "{{ site.data.author.structured_data.seeking }}",
  "interactionStatistic": [
    {
      "@type": "InteractionCounter",
      "interactionType": "https://schema.org/WriteAction",
      "name": "Blog posts written",
      "userInteractionCount": {{ site.posts | size }}
    },
    {
      "@type": "InteractionCounter",
      "interactionType": "https://schema.org/CreateAction",
      "name": "Open source projects",
      "userInteractionCount": {{ site.projects | size }}
    }
  ]
}
</script>
