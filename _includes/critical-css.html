<!-- Critical CSS for Above-the-Fold Rendering
     Inlined to eliminate render-blocking requests
     Full stylesheet loads deferred after initial paint -->
<style>
/* Variables - Required by all components */
:root {
    --primary-color: #06b6d4;
    --primary-dark: #0284c7;
    --primary-light: #38bdf8;
    --secondary-color: #f59e0b;
    --button-color: #10b981;
    --button-dark: #059669;
    --button-light: #34d399;
    --bg-darker: #020617;
    --bg-dark: #0f172a;
    --bg-light: #1e293b;
    --bg-white: #334155;
    --text-dark: #f1f5f9;
    --text-light: #cbd5e1;
    --border-color: #475569;
    --accent-warm: #f59e0b;
    --accent-orange: #ea580c;
    --accent-rust: #dc2626;
    --accent-purple: #a855f7;
    --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5), 0 2px 4px -1px rgba(0, 0, 0, 0.3);
    --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.6), 0 10px 10px -5px rgba(0, 0, 0, 0.4);
}

/* Base Reset */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* Body - Core styles for initial render */
body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    line-height: 1.6;
    color: var(--text-dark);
    background-color: var(--bg-dark);
}

/* Container - Used by navigation and hero */
.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 20px;
}

/* Navigation - Always above the fold */
.navbar {
    background-color: var(--bg-darker);
    box-shadow: var(--shadow);
    position: sticky;
    top: 0;
    z-index: 1000;
    padding: 1rem 0;
    border-bottom: 1px solid var(--border-color);
}

.navbar .container {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 1.5rem;
    font-weight: 700;
    text-decoration: none;
    transition: color 0.3s ease;
}

.logo-primary {
    color: var(--primary-color);
}

.logo-secondary {
    color: var(--secondary-color);
}

.nav-menu {
    display: flex;
    list-style: none;
    gap: 2rem;
    align-items: center;
}

.nav-link {
    color: var(--text-dark);
    text-decoration: none;
    font-weight: 500;
    transition: color 0.3s ease;
    position: relative;
}

.nav-link::after {
    content: '';
    position: absolute;
    bottom: -5px;
    left: 0;
    width: 0;
    height: 2px;
    background-color: var(--primary-color);
    transition: width 0.3s ease;
}

.nav-link:hover,
.nav-link.active {
    color: var(--primary-color);
}

.nav-link:hover::after,
.nav-link.active::after {
    width: 100%;
}

/* Hamburger menu */
.hamburger {
    display: none;
    flex-direction: column;
    cursor: pointer;
    gap: 4px;
}

.hamburger span {
    width: 25px;
    height: 3px;
    background-color: var(--text-dark);
    transition: all 0.3s ease;
}

/* Hero Section - Homepage above the fold */
.hero {
    padding: 6rem 0;
    position: relative;
    color: white;
    text-align: center;
    border-bottom: 1px solid var(--border-color);
    overflow: hidden;
}

.hero-background {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    opacity: 0;
    transition: opacity 4s ease-in-out;
    z-index: 0;
}

.hero-background.active {
    opacity: 1;
}

.hero-overlay {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(135deg, rgba(2, 6, 23, 0.95) 0%, rgba(15, 23, 42, 0.9) 50%, rgba(2, 6, 23, 0.95) 100%);
    z-index: 1;
}

.hero-content {
    position: relative;
    z-index: 2;
    max-width: 800px;
    margin: 0 auto;
}

.hero h1 {
    font-size: 3.5rem;
    font-weight: 700;
    margin-bottom: 1rem;
}

.hero .highlight {
    color: var(--primary-color);
}

.hero p {
    font-size: 1.25rem;
    margin-bottom: 2rem;
    color: var(--text-light);
}

/* Mobile Navigation - Critical for mobile users */
@media (max-width: 768px) {
    .hamburger {
        display: flex;
    }

    .nav-menu {
        position: fixed;
        left: -100%;
        top: 70px;
        flex-direction: column;
        background-color: var(--bg-darker);
        width: 100%;
        text-align: center;
        transition: left 0.3s ease;
        box-shadow: var(--shadow-lg);
        padding: 2rem 0;
        gap: 0;
    }

    .nav-menu.active {
        left: 0;
    }

    .nav-menu li {
        padding: 1rem 0;
        width: 100%;
        border-bottom: 1px solid var(--border-color);
    }

    .hero h1 {
        font-size: 2.5rem;
    }
}
</style>
