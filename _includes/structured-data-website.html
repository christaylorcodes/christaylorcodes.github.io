<!-- Enhanced WebSite Schema (JSON-LD) with Search Action -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "{{ site.title }}",
  "url": "{{ site.url }}",
  "description": "{{ site.description }}",
  "inLanguage": "en-US",
  "author": {
    "@type": "Person",
    "name": "{{ site.data.author.name }}",
    "url": "{{ site.url }}{{ '/about' | relative_url }}",
    "email": "{{ site.data.contact.email }}",
    "jobTitle": "{{ site.data.author.structured_data.job_title }}"
  },
  "potentialAction": {
    "@type": "SearchAction",
    "target": {
      "@type": "EntryPoint",
      "urlTemplate": "{{ site.url }}{{ '/blog' | relative_url }}?q={search_term_string}"
    },
    "query-input": "required name=search_term_string"
  },
  "publisher": {
    "@type": "Person",
    "name": "{{ site.data.author.name }}",
    "url": "{{ site.url }}"
  }
}
</script>

<!-- Organization/ProfessionalService Schema -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ProfessionalService",
  "name": "{{ site.title }}",
  "url": "{{ site.url }}",
  "description": "{{ site.description }}",
  "founder": {
    "@type": "Person",
    "name": "{{ site.data.author.name }}",
    "jobTitle": "{{ site.data.author.structured_data.job_title }}",
    "email": "{{ site.data.contact.email }}"
  },
  "sameAs": {{ site.data.contact.social_profiles | jsonify }},
  "areaServed": {
    "@type": "Country",
    "name": "{{ site.data.author.location }}"
  },
  "serviceType": {{ site.data.author.expertise.core_services | jsonify }}
}
</script>

<!-- BreadcrumbList Schema for Site Navigation -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Home",
      "item": "{{ site.url }}"
    },
    {
      "@type": "ListItem",
      "position": 2,
      "name": "Blog",
      "item": "{{ site.url }}{{ '/blog' | relative_url }}"
    },
    {
      "@type": "ListItem",
      "position": 3,
      "name": "Projects",
      "item": "{{ site.url }}{{ '/projects' | relative_url }}"
    },
    {
      "@type": "ListItem",
      "position": 4,
      "name": "About",
      "item": "{{ site.url }}{{ '/about' | relative_url }}"
    },
    {
      "@type": "ListItem",
      "position": 5,
      "name": "Contact",
      "item": "{{ site.url }}{{ '/contact' | relative_url }}"
    }
  ]
}
</script>
