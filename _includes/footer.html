<footer class="footer">
    <div class="container">
        <div class="footer-content">
            <div class="footer-section">
                <h3>{{ site.title }}</h3>
                <p>{{ site.description }}</p>
            </div>

            <div class="footer-section">
                <h3>Connect</h3>
                <div class="social-links">
                    {% for link_data in site.data.contact.social_links %}
                        {% assign link_key = link_data[0] %}
                        {% assign link = link_data[1] %}
                        {% if link.show_in_footer %}
                        <a href="{{ link.url }}" target="_blank" rel="noopener noreferrer" aria-label="{{ link_key | capitalize }}">
                            <i class="{{ link.icon }}"></i>
                        </a>
                        {% endif %}
                    {% endfor %}

                    <a href="mailto:{{ site.data.contact.email }}" aria-label="Email">
                        <i class="fas fa-envelope"></i>
                    </a>

                    <a href="{{ '/feed.xml' | relative_url }}" target="_blank" rel="noopener noreferrer" aria-label="RSS Feed">
                        <i class="fas fa-rss"></i>
                    </a>
                </div>
            </div>
        </div>

        <div class="footer-bottom">
            <p>&copy; {{ 'now' | date: "%Y" }} {{ site.title }}. All rights reserved.</p>
        </div>
    </div>
</footer>
