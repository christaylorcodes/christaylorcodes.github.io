# Bio Paragraphs (for About page)
bio:
  introduction: |
    I'm a Network Operations Chief, vCTO, and Automation Engineer at i.t.NOW, a global
    managed services provider. With 20+ years of professional experience (since 2002),
    I specialize in infrastructure automation, AI integration, and building scalable
    multi-tenant solutions that power MSP operations across diverse industries.

  background: |
    My journey in technology began in elementary school, where I spent my time
    helping the school librarian troubleshoot and fix computer issues. That early
    spark of curiosity grew into a lifelong passion for understanding how systems
    work and finding better ways to make them run. I started my professional career
    in 2002 with EchoStar doing satellite communications, and over the past two decades,
    I've evolved into a leader who specializes in MSP operations, infrastructure
    automation, and AI-driven solutions.

