# Bio Paragraphs (for About page)
bio:
  introduction: |
    I run network operations and automation at i.t.NOW, a Managed Service Provider
    (MSP). I've been doing this since 2002 - building the infrastructure and tooling
    that keeps MSP operations running across multiple clients and environments. Most
    of my work lives at the intersection of PowerShell, APIs, and making complex
    systems talk to each other.

  background: |
    I started fixing computers for the school librarian in elementary school and
    never really stopped. My professional career kicked off in 2002 at EchoStar
    doing satellite communications. Since then I've moved through the MSP world -
    from hands-on network engineering to building automation frameworks and
    integrating AI into daily operations.

