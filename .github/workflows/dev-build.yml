name: Dev Branch Build and Test

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Setup Ruby
        uses: ruby/setup-ruby@d5126b9b3579e429dd52e51e68624dda2e05be25 # v1.267.0
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
        with:
          node-version: '20'

      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: development

      - name: Verify critical files exist
        run: |
          echo "✅ Build successful!"
          echo "📦 Site built to _site directory"
          echo "🔍 Checking for critical files..."

          # Check if critical files exist
          if [ ! -f "_site/index.html" ]; then
            echo "❌ Error: index.html not found in build output"
            exit 1
          fi

          if [ ! -f "_site/assets/css/styles.css" ]; then
            echo "❌ Error: styles.css not found in build output"
            exit 1
          fi

          echo "✅ All critical files present"

      - name: Lint markdown files
        uses: nosborn/github-action-markdown-cli@9b5e871c11cc0649c5ac2526af22e23525fa344d # v3.3.0
        with:
          files: '_posts/*.md'
          config_file: '.markdownlint.json'
          ignore_files: 'node_modules/'

      - name: Install html-proofer
        run: gem install html-proofer

      - name: Validate HTML and check internal links
        run: |
          echo "🔍 Running HTML validation and link checking..."
          htmlproofer ./_site \
            --disable-external \
            --allow-hash-href \
            --ignore-urls "/localhost/,/christaylor.codes/,/christaylorcodes.github.io/" \
            --checks Images,Scripts \
            --ignore-files "/assets/,/feed.xml/" \
            --log-level :info

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.13.x

      - name: Start Jekyll server
        run: bundle exec jekyll serve --detach --port 4000
        env:
          JEKYLL_ENV: development

      - name: Wait for server
        run: |
          echo "Waiting for Jekyll server to start..."
          npx wait-on http://localhost:4000 --timeout 30000

      - name: Run Lighthouse CI
        run: |
          lhci autorun --config=.lighthouserc.json
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}
          LHCI_BUILD_CONTEXT__COMMIT_TIME: ${{ github.event.head_commit.timestamp }}

      - name: Upload Lighthouse results
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        if: always()
        with:
          name: lighthouse-results
          path: .lighthouseci/
          retention-days: 30

      - name: Build summary
        if: always()
        run: |
          echo "## ✅ Dev Build Quality Checks Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Validation Results:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Jekyll build successful" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Critical files verified" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Markdown linting passed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ HTML validation and link checking passed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Lighthouse CI performance/accessibility/SEO checks passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps:" >> $GITHUB_STEP_SUMMARY
          echo "1. Review Lighthouse results in artifacts (if any warnings)" >> $GITHUB_STEP_SUMMARY
          echo "2. Test locally with \`.\build.ps1\`" >> $GITHUB_STEP_SUMMARY
          echo "3. When ready to deploy, run \`.\promote-to-main.ps1\`" >> $GITHUB_STEP_SUMMARY
          echo "4. The promotion script will merge dev → main and trigger production deployment" >> $GITHUB_STEP_SUMMARY
